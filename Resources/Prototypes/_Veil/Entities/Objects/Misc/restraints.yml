- type: entity
  abstract: true
  parent: BaseItem
  id: BaseRestraintCuffs
  components:
  - type: Item
    size: Small
    storedRotation: 90
  - type: Handcuff
    cuffedRSI: Objects/Misc/handcuffs.rsi
    bodyIconState: body-overlay
  - type: Tag
    tags:
    - Handcuffs
  - type: MeleeWeapon
    wideAnimationRotation: 90
    resetOnHandSelected: false
    animation: WeaponArcDisarm
    damage:
      types:
        Blunt: 0
  - type: UseDelay
    delay: 3

- type: entity
  parent: BaseRestraintCuffs
  id: SilkRibbonCuffs
