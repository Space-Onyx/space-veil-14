- type: entity
  abstract: true
  parent: BaseItem
  id: BaseRestraintCuffs
  components:
  - type: Item
    size: Small
    storedRotation: 90
  - type: Handcuff
    cuffedRSI: Objects/Misc/handcuffs.rsi
    bodyIconState: body-overlay
  - type: Tag
    tags:
    - Handcuffs
  - type: MeleeWeapon
    wideAnimationRotation: 90
    resetOnHandSelected: false
    animation: WeaponArcDisarm
    damage:
      types:
        Blunt: 0
  - type: UseDelay
    delay: 3

- type: entity
  parent: BaseRestraintCuffs
  id: SilkRibbonCuffs
  name: silk ribbon
  description: A soft colorful ribbon for playful bondage games.
  components:
  - type: Handcuff
    breakoutTime: 45
  - type: Sprite
    sprite: _Veil/Objects/Misc/restraints.rsi
    state: silk_ribbon

- type: entity
  parent: BaseRestraintCuffs
  id: RopeCuffs
  name: rope cuffs
  description: A classy rope for tying someone up gently.
  components:
  - type: Handcuff
    breakoutTime: 45
  - type: Sprite
    sprite: _Veil/Objects/Misc/restraints.rsi
    state: cuff_rope

- type: entity
  parent: BaseRestraintCuffs
  id: BeltCuffs
  name: belt cuffs
  description: Suspending belts that double as soft restraints.
  components:
  - type: Handcuff
    breakoutTime: 45
  - type: Sprite
    sprite: _Veil/Objects/Misc/restraints.rsi
    state: cuff_belts

- type: entity
  parent: BaseRestraintCuffs
  id: BondageRope
  name: bondage rope
  description: A rope designed to not cut into skin. Perfect for tying someone up.
  components:
  - type: Handcuff
    breakoutTime: 60
  - type: Sprite
    sprite: _Veil/Objects/Misc/restraints.rsi
    state: rope

- type: entity
  parent: BaseRestraintCuffs
  id: PinkCuffs
  name: pink cuffs
  description: Soft pink cuffs for bedroom games.
  components:
  - type: Handcuff
    breakoutTime: 1
  - type: Sprite
    sprite: _Veil/Objects/Specific/SexToys/lewd_items.rsi
    state: pinkcuffs

- type: entity
  parent: BaseRestraintCuffs
  id: ShibariCuffs
  name: shibari rope
  description: Soft rope arranged for the Japanese art of decorative bondage.
  components:
  - type: Handcuff
    breakoutTime: 60
    cuffedRSI: _Veil/Objects/Misc/shibari.rsi
    bodyIconState: body-overlay
    startCuffSound:
      path: /Audio/Items/Handcuffs/rope_start.ogg
    endCuffSound:
      path: /Audio/Items/Handcuffs/rope_end.ogg
    startUncuffSound:
      path: /Audio/Items/Handcuffs/rope_start.ogg
    endUncuffSound:
      path: /Audio/Items/Handcuffs/rope_breakout.ogg
    startBreakoutSound:
      path: /Audio/Items/Handcuffs/rope_takeoff.ogg
  - type: Sprite
    sprite: _Veil/Objects/Misc/shibari.rsi
    state: icon

- type: entity
  parent: BaseItem
  id: LeatherLeash
  name: leather leash
  description: A long leather leash made to fasten to a matching collar.
  components:
  - type: Sprite
    sprite: _Veil/Objects/Misc/leather_leash.rsi
    state: icon
  - type: Item
    size: Small
  - type: Leash
    maxDistance: 3
