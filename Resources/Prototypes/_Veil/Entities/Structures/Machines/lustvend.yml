- type: entity
  parent: VendingMachine
  id: KinkMate
  name: KinkMate
  description: A vending machine for all your unmentionable desires.
  components:
  - type: VendingMachine
    pack: LustVendInventory
    priceMultiplier: 1
  - type: VendingMachineVisuals
    offState: sexnow-off
    brokenState: sexnow-broken
    normalState: sexnow
    denyState: sexnow-deny
  - type: Sprite
    sprite: _Veil/Structures/Machines/VendingMachines/kinkomate.rsi
    layers:
    - state: sexnow-off
      map: ["enum.VendingMachineVisualLayers.Base"]
    - state: sexnow-off
      map: ["enum.VendingMachineVisualLayers.BaseUnshaded"]
      shader: unshaded
    - state: kink-panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: PointLight
    color: "#E5679E"
